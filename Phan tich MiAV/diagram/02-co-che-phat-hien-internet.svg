<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="830" viewBox="0 0 1180 830">
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#20301C"/></marker>
</defs>
<rect width="100%" height="100%" fill="#F7F5EE"/>
<text x="30" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#20301C" text-anchor="start" font-weight="bold">Co che phat hien may co lich su ket noi Internet</text>

<text x="30" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start" font-weight="normal">Khong doc lich su trinh duyet / SRUM / DNS cache. Thay vao do: do trang thai ket noi hien tai + gom bang ket noi + ghi su kien.</text>
<rect x="40" y="100" width="340" height="175" rx="6" fill="#FFFFFF" stroke="#8C1D18" stroke-width="2.5"/>
<text x="210.0" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8C1D18" text-anchor="middle" font-weight="bold">1. Lenh mang (MiAV.exe)</text>
<text x="50" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">cmd.exe /C ipconfig/all  -&gt; policy.info</text>
<text x="50" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">cmd.exe /C ping 8.8.8.8  -&gt; policy.ping</text>
<text x="50" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">cmd.exe /C netstat -nao   -&gt; policy.net</text>
<text x="50" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">cmd.exe /C tracert wikipedia.org</text>
<text x="50" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">        -&gt; policy.tracertWiki</text>
<text x="50" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">cmd.exe /C tracert 27.68.131.116</text>
<text x="50" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">        -&gt; policy.tracertpBTL</text>
<text x="50" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">cmd.exe /C tracert 10.152.4.2</text>
<text x="50" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">        -&gt; policy.tracertlBTL</text>
<rect x="40" y="310" width="340" height="120" rx="6" fill="#FFFFFF" stroke="#8C1D18" stroke-width="2.5"/>
<text x="210.0" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8C1D18" text-anchor="middle" font-weight="bold">2. Gom bang ket noi (MiAV_Protect)</text>
<text x="50" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">netstat -nao  (C:\windows\system32)</text>
<text x="50" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">-&gt; truong "connections" trong JSON:</text>
<text x="50" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">{"OS":..,"network":..,"connections":..,</text>
<text x="50" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal"> "list_process":..,"list_auto_run":..}</text>
<rect x="40" y="465" width="340" height="120" rx="6" fill="#FFFFFF" stroke="#8C1D18" stroke-width="2.5"/>
<text x="210.0" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8C1D18" text-anchor="middle" font-weight="bold">3. Canh bao URL</text>
<text x="50" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">{"src_mac":..,"src_ip":..,"alert_type":..,</text>
<text x="50" y="521" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal"> "alert_desc":..,"alert_url":..,"alert_level":..}</text>
<text x="50" y="537" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">-&gt; URL muc tieu bi ghi lai</text>
<rect x="430" y="100" width="330" height="160" rx="6" fill="#FDF6E3" stroke="#C89B1E" stroke-width="3"/>
<text x="595.0" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C89B1E" text-anchor="middle" font-weight="bold">4. Ghi su kien (nhan nhom)</text>
<text x="440" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">type   = "Internet"</text>
<text x="440" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">name   = "Plug-in" / "Plug-out"</text>
<text x="440" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">level  = "Alert"</text>
<text x="440" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">data   = {"ComputerName":%s,"FullMac":%s,</text>
<text x="440" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">          "Time":%s,"description":%s}</text>
<text x="440" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">xac minh: VA 0x00981ed7 / 0x00981fa4</text>
<rect x="430" y="310" width="330" height="140" rx="6" fill="#F3EFE2" stroke="#1F5C2E" stroke-width="2.5"/>
<text x="595.0" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1F5C2E" text-anchor="middle" font-weight="bold">5. Bang Logs (SQLite)</text>
<text x="440" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">C:\Users\Public\Documents\AgentFMC\</text>
<text x="440" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">  data\data.db -&gt; bang "Logs"</text>
<text x="440" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">  type, name, log_time, data,</text>
<text x="440" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">  time_sent, level, id</text>
<text x="440" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">cot time_sent = da gui di hay chua</text>
<rect x="430" y="490" width="330" height="95" rx="6" fill="#F3EFE2" stroke="#1F5C2E" stroke-width="2.5"/>
<text x="595.0" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1F5C2E" text-anchor="middle" font-weight="bold">6. File log dang text</text>
<text x="440" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">..\AgentFMC\logs\</text>
<text x="440" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">..\AgentFMC\log.txt</text>
<text x="440" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">..\AgentFMC\syslog.ini</text>
<rect x="830" y="100" width="310" height="200" rx="6" fill="#FFFFFF" stroke="#8C1D18" stroke-width="2.5"/>
<text x="985.0" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8C1D18" text-anchor="middle" font-weight="bold">7. Gui len server FMS</text>
<text x="840" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">/api/v1/events/insert</text>
<text x="840" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">/api/v1/alerts/insert</text>
<text x="840" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">/api/v1/active-devices/insert</text>
<text x="840" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">/api/v1/hashs/by-date</text>
<text x="840" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal"></text>
<text x="840" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">HTTPS (OpenSSL: libeay32/ssleay32)</text>
<text x="840" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">Xac thuc: public.pem (RSA) + JWT RS256</text>
<rect x="830" y="340" width="310" height="150" rx="6" fill="#FFFFFF" stroke="#C89B1E" stroke-width="2.5"/>
<text x="985.0" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C89B1E" text-anchor="middle" font-weight="bold">8. Lop song song: SerDefense</text>
<text x="840" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">Service "MiAV_Defense"</text>
<text x="840" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">cmd.exe /C , sc.exe , wmic bios</text>
<text x="840" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">WMI: Win32_NetworkAdapterConfiguration</text>
<text x="840" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">Loc: Loopback / WAN Miniport / Async /</text>
<text x="840" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">      Kaspersky / Virtual / 169.254</text>
<text x="840" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">Kenh WebSocket (sgcWebSockets)</text>
<line x1="380" y1="185" x2="430" y2="160" stroke="#8C1D18" stroke-width="2" marker-end="url(#ah)"/>
<rect x="378.6" y="158.5" width="52.800000000000004" height="17" fill="#F7F5EE" opacity="0.92" rx="3"/>
<text x="405.0" y="170.5" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8C1D18" text-anchor="middle" font-weight="normal">ket qua</text>
<line x1="380" y1="370" x2="430" y2="370" stroke="#8C1D18" stroke-width="2" marker-end="url(#ah)"/>
<line x1="380" y1="525" x2="430" y2="350" stroke="#8C1D18" stroke-width="2" marker-end="url(#ah)"/>
<line x1="760" y1="170" x2="830" y2="170" stroke="#8C1D18" stroke-width="2" marker-end="url(#ah)"/>
<rect x="778.2" y="156.0" width="33.6" height="17" fill="#F7F5EE" opacity="0.92" rx="3"/>
<text x="795.0" y="168.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8C1D18" text-anchor="middle" font-weight="normal">POST</text>
<line x1="760" y1="380" x2="830" y2="250" stroke="#1F5C2E" stroke-width="2" marker-end="url(#ah)"/>
<rect x="778.2" y="301.0" width="33.6" height="17" fill="#F7F5EE" opacity="0.92" rx="3"/>
<text x="795.0" y="313.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#1F5C2E" text-anchor="middle" font-weight="normal">POST</text>
<line x1="760" y1="535" x2="830" y2="230" stroke="#1F5C2E" stroke-width="2" marker-end="url(#ah)"/>
<rect x="778.2" y="368.5" width="33.6" height="17" fill="#F7F5EE" opacity="0.92" rx="3"/>
<text x="795.0" y="380.5" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#1F5C2E" text-anchor="middle" font-weight="normal">POST</text>
<line x1="595" y1="260" x2="595" y2="310" stroke="#20301C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="595" y1="450" x2="595" y2="490" stroke="#20301C" stroke-width="2" marker-end="url(#ah)"/>
<text x="40" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8C1D18" text-anchor="start" font-weight="bold">KET LUAN</text>
<text x="40" y="665" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#20301C" text-anchor="start" font-weight="normal">- MiAV khong doc lich su trinh duyet, SRUM, DNS cache, prefetch, amcache, RunMRU -&gt; KHONG can xoa cac artifact nay de 'danh trao' voi MiAV.</text>
<text x="40" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#20301C" text-anchor="start" font-weight="normal">- Bang chung 'da tung noi Internet' cua MiAV nam o: file policy.*, bang Logs trong data.db, thu muc logs\ va log.txt.</text>
<text x="40" y="703" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#20301C" text-anchor="start" font-weight="normal">- MiAV ghi nhat theo thoi diem: moi lan 'Plug-in' (may ket noi duoc Internet) deu bi ghi va gui di.</text>
<text x="40" y="722" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#20301C" text-anchor="start" font-weight="normal">- Du lieu da gui len server KHONG thu hoi duoc bang thao tac cuc bo -&gt; can de nghi quan tri vien phia FMS/BTL86 xoa lich su thiet bi.</text>
</svg>
