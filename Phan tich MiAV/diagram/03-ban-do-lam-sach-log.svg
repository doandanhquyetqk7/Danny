<text x="40" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">1. Dung service:  sc stop MiAVProtect / MiAVUpdate / MiAVWD / Defense   (va tat MiAV.exe trong Task Manager)</text>
<text x="40" y="756" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">2. Sao luu c:\_MiAV_backup\ roi xoa cac muc BAT BUOC o cot 1</text>
<text x="40" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">3. Xoa cac muc NEN LAM o cot 2   -&gt;   4. (tuy chon) cot 3</text>
<text x="40" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#20301C" text-anchor="start" font-weight="normal">5. Bat lai service va kiem tra: sau khi khoi dong lai, MiAV se tao lai policy.* -&gt; day la dau hieu no da do lai</text>
<text x="30" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8C1D18" text-anchor="start" font-weight="bold">LUU Y QUAN TRONG</text>
<text x="40" y="822" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#20301C" text-anchor="start" font-weight="normal">- Xoa log cuc bo KHONG xoa duoc du lieu da gui len server FMS. Cot time_sent trong bang Logs cho biet du lieu nao da di.</text>
<text x="40" y="840" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#20301C" text-anchor="start" font-weight="normal">- Neu may da tung noi Internet, MiAV se TU TAO LAI file policy.* o lan chay ke tiep -&gt; vi vay phai lam sach khi may DA NGAT mang Internet.</text>
<text x="40" y="858" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#20301C" text-anchor="start" font-weight="normal">- Can thoi gian cho du lau (xem bao cao muc 6) de moi su kien da ghi da kip gui di hoac bi xoa.</text>
<text x="40" y="876" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#20301C" text-anchor="start" font-weight="normal">- Moi thao tac phai thuc hien TRUOC khi noi vao mang truyen so lieu quan su.</text>
