ff" text-anchor="middle">0x91468C</text><rect x="240.0" y="252.0" width="720.0" height="26.0" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="252.0" y="266.0" font-family="Segoe UI, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#8b949e" text-anchor="start">  (1) isUSBCY — nhận diện USB hãng CY</text><rect x="120.0" y="288.0" width="110.0" height="26.0" rx="5" fill="#1c2430" stroke="#bc8cff" stroke-width="1.2"/><text x="175.0" y="302.0" font-family="Segoe UI, Consolas, monospace" font-size="11" font-weight="bold" fill="#bc8cff" text-anchor="middle">0x914D40</text><rect x="240.0" y="288.0" width="720.0" height="26.0" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="252.0" y="302.0" font-family="Segoe UI, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#8b949e" text-anchor="start">  (2) isUSBATT — serial 00113335555 → "An toan 3.0"</text><rect x="120.0" y="324.0" width="110.0" height="22.0" rx="5" fill="#1c2430" stroke="#bc8cff" stroke-width="1.2"/><text x="175.0" y="336.0" font-family="Segoe UI, Consolas, monospace" font-size="11" font-weight="bold" fill="#bc8cff" text-anchor="middle">0x914EA8</text><rect x="240.0" y="324.0" width="720.0" height="22.0" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="252.0" y="336.0" font-family="Segoe UI, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#8b949e" text-anchor="start">  (3) GetTypeUSB — label + inf.bin + đếm 5 file</text><rect x="120.0" y="356.0" width="110.0" height="22.0" rx="5" fill="#1c2430" stroke="#d29922" stroke-width="1.2"/><text x="175.0" y="368.0" font-family="Segoe UI, Consolas, monospace" font-size="11" font-weight="bold" fill="#d29922" text-anchor="middle">0x9141B8</text><rect x="240.0" y="356.0" width="720.0" height="22.0" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="252.0" y="368.0" font-family="Segoe UI, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#8b949e" text-anchor="start">Đọc 20 byte đầu, so 4 hằng: 0x120089/0x120116/0x1200a0/0x1f01ff</text><rect x="120.0" y="388.0" width="110.0" height="22.0" rx="5" fill="#1c2430" stroke="#d29922" stroke-width="1.2"/><text x="175.0" y="400.0" font-family="Segoe UI, Consolas, monospace" font-size="11" font-weight="bold" fill="#d29922" text-anchor="middle">0x914440</text><rect x="240.0" y="388.0" width="720.0" height="22.0" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="252.0" y="400.0" font-family="Segoe UI, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#8b949e" text-anchor="start">CheckFileUSB — parse 4 field của :\inf.bin qua COM</text><rect x="120.0" y="420.0" width="110.0" height="22.0" rx="5" fill="#1c2430" stroke="#d29922" stroke-width="1.2"/><text x="175.0" y="432.0" font-family="Segoe UI, Consolas, monospace" font-size="11" font-weight="bold" fill="#d29922" text-anchor="middle">0x91E148</text><rect x="240.0" y="420.0" width="720.0" height="22.0" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="252.0" y="432.0" font-family="Segoe UI, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#8b949e" text-anchor="start">Đọc section [Drive] trong config.ini</text><rect x="120.0" y="452.0" width="110.0" height="26.0" rx="5" fill="#1c2430" stroke="#3fb950" stroke-width="1.2"/><text x="175.0" y="466.0" font-family="Segoe UI, Consolas, monospace" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">0x916AC8</text><rect x="240.0" y="452.0" width="720.0" height="26.0" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="252.0" y="466.0" font-family="Segoe UI, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#8b949e" text-anchor="start">WritesyslogUSBadd — ghi log JSON {disk,version,serial,diskinfo}</text><rect x="120.0" y="488.0" width="110.0" height="22.0" rx="5" fill="#1c2430" stroke="#f85149" stroke-width="1.2"/><text x="175.0" y="500.0" font-family="Segoe UI, Consolas, monosp